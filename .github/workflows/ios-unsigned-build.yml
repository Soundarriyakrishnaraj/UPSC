
name: iOS Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Display Flutter version
        run: flutter --version

      - name: Display Xcode version
        run: xcodebuild -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign

      - name: Verify Runner.app exists
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Runner.app not found!"
            exit 1
          fi
          echo "Runner.app found successfully."

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Test11-unsigned.ipa Payload
          test -f Test11-unsigned.ipa
          echo "IPA created successfully."
          unzip -l Test11-unsigned.ipa | grep "Payload/Runner.app"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test11-Unsigned-iOS
          path: Test11-unsigned.ipa
          if-no-files-found: error

      - name: Zip Runner.app
        run: |
          zip -r Runner-app.zip build/ios/iphoneos/Runner.app

      - name: Upload Runner.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: Runner-app.zip
          if-no-files-found: error
